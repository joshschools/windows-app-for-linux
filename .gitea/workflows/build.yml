name: build

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: qnap-docker
    container:
      image: node:20-bookworm
      options: --add-host=git.koprowski.cc:192.168.1.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Install flatpak build tools
        run: |
          apt-get update
          apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install -y flathub \
            org.freedesktop.Platform//24.08 \
            org.freedesktop.Sdk//24.08 \
            org.electronjs.Electron2.BaseApp//24.08

      - name: Build AppImage + Flatpak
        run: npm run build

      - name: Publish build as a release
        env:
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API: http://git.koprowski.cc:3000/api/v1/repos/mkoprowski/windows-app-for-linux
          TAG: latest-build
        run: |
          set -e
          existing_id=$(curl -s -H "Authorization: token $GITEA_TOKEN" "$API/releases/tags/$TAG" \
            | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{const j=JSON.parse(d);console.log(j.id||'')}catch(e){console.log('')}})")
          if [ -n "$existing_id" ]; then
            curl -s -X DELETE -H "Authorization: token $GITEA_TOKEN" "$API/releases/$existing_id"
          fi
          curl -s -X DELETE -H "Authorization: token $GITEA_TOKEN" "$API/tags/$TAG" || true

          release_id=$(curl -s -X POST -H "Authorization: token $GITEA_TOKEN" -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"$TAG\",\"name\":\"Latest build\",\"target_commitish\":\"${GITHUB_SHA:-main}\",\"prerelease\":true}" \
            "$API/releases" \
            | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{console.log(JSON.parse(d).id)})")

          for f in dist/*.AppImage dist/*.flatpak; do
            name=$(basename "$f")
            curl -s -X POST -H "Authorization: token $GITEA_TOKEN" \
              -F "attachment=@$f" \
              "$API/releases/$release_id/assets?name=$name"
          done
